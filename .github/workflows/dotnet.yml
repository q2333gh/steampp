name: Build

env:
  ProjectName: Steam++

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: false

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3.0.2
      with:
        dotnet-version: 8.0.x

    - name: Install required workloads (Windows)
      run: dotnet workload install maui-android android wasm-tools

    - name: Verify dotnet info
      run: dotnet --info

    - name: Materialize external source dependencies
      shell: pwsh
      run: .\.github\scripts\materialize-external-deps.ps1

    - name: Ensure local NuGet source exists
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path .\references\NuGetPackages | Out-Null

    - name: dotnet restore SteamToolsV2+.sln
      run: dotnet restore ./SteamToolsV2+.sln -p:CheckEolTargetFramework=false

    - name: Build AvaloniaApp Release
      run: dotnet build ./src/ST.Client.Desktop.Avalonia.App/ST.Client.Avalonia.App.csproj -c Release

    - name: Run CommonUnit
      run: dotnet test ./tests/Common.UnitTest/Common.UnitTest.csproj -c Release

    - name: Run ST.Client.UnitTest
      run: dotnet test ./tests/ST.Client.UnitTest/ST.Client.UnitTest.csproj -c Release

    - name: Run ST.Client.Desktop.UnitTest
      run: dotnet test ./tests/ST.Client.Desktop.UnitTest/ST.Client.Desktop.UnitTest.csproj -c Release

    - name: Get Short CommitId
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      shell: pwsh
      run: Write-Output "GITHUB_SHA_SHORT=$(${env:GITHUB_SHA}.Substring(0,7))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Publish Windows targets (secret-free)
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      shell: pwsh
      run: .\packaging\build.ps1 -configuration Release

    - name: Package publish outputs to zip
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      shell: pwsh
      run: |
        $base = ".\src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish"
        $out = "$base\ci-artifacts"
        New-Item -ItemType Directory -Force -Path $out | Out-Null

        $items = @(
          @{ Rid = "fd-win-x64"; Src = "$base\FrameworkDependent\fd-win-x64"; Name = "[Release]Steam++_win_x64_fde_${env:GITHUB_SHA_SHORT}.zip" },
          @{ Rid = "win-x64";    Src = "$base\win-x64";                         Name = "[Release]Steam++_win_x64_${env:GITHUB_SHA_SHORT}.zip" },
          @{ Rid = "fd-win-x86"; Src = "$base\FrameworkDependent\fd-win-x86"; Name = "[Release]Steam++_win_x86_fde_${env:GITHUB_SHA_SHORT}.zip" },
          @{ Rid = "win-x86";    Src = "$base\win-x86";                         Name = "[Release]Steam++_win_x86_${env:GITHUB_SHA_SHORT}.zip" }
        )

        foreach ($item in $items) {
          if (-not (Test-Path $item.Src)) {
            throw "Missing publish output for $($item.Rid): $($item.Src)"
          }

          $zipPath = Join-Path $out $item.Name
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$($item.Src)\*" -DestinationPath $zipPath -CompressionLevel Optimal
        }

    - name: Upload win-x64 fde App Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      uses: actions/upload-artifact@v4
      with:
        name: '[Release]Steam++_win_x64_fde_${{ env.GITHUB_SHA_SHORT }}'
        path: src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish\ci-artifacts\[Release]Steam++_win_x64_fde_${{ env.GITHUB_SHA_SHORT }}.zip

    - name: Upload win-x64 App Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      uses: actions/upload-artifact@v4
      with:
        name: '[Release]Steam++_win_x64_${{ env.GITHUB_SHA_SHORT }}'
        path: src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish\ci-artifacts\[Release]Steam++_win_x64_${{ env.GITHUB_SHA_SHORT }}.zip

    - name: Upload win-x86 fde App Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      uses: actions/upload-artifact@v4
      with:
        name: '[Release]Steam++_win_x86_fde_${{ env.GITHUB_SHA_SHORT }}'
        path: src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish\ci-artifacts\[Release]Steam++_win_x86_fde_${{ env.GITHUB_SHA_SHORT }}.zip

    - name: Upload win-x86 App Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
      uses: actions/upload-artifact@v4
      with:
        name: '[Release]Steam++_win_x86_${{ env.GITHUB_SHA_SHORT }}'
        path: src\ST.Client.Desktop.Avalonia.App\bin\Release\Publish\ci-artifacts\[Release]Steam++_win_x86_${{ env.GITHUB_SHA_SHORT }}.zip
